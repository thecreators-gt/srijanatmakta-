<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Srijanatmakta ^-^</title> 
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
  body {
    background-image: 
      linear-gradient(rgba(245,240,255,0.8), rgba(245,240,255,0.8)),
      url('background.jpg');
    background-size: cover;
    background-position: center;
  }
  </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat">
<div class="w-full min-h-screen flex flex-col items-center justify-center -translate-y-10 px-6 text-center">

  <h1 class="text-3xl md:text-4xl font-bold text-purple-700 mb-3">
    Srijanatmakta ^-^
   </h1>
  <!-- Tagline -->
  <p class="text-lg text-purple-600 mb-6">
  where curiosity meets creativity✨🎀
 </p>
  <!-- Gratitude Message -->
    <div class="bg-white rounded-3xl shadow-xl p-10 mb-12">
      <p class="text-3xl font-light text-gray-700">
        Thank you for visiting our little corner of creativity!<br>
        Every piece is handmade with care.
      </p>
    </div>

    <!-- Navigation Icons -->
   <div class="flex justify-center gap-10 mt-2 flex-wrap">
<a href="shop.html" class="nav-card w-40 h-40 flex flex-col items-center justify-center">
  <i class="fa-solid fa-store text-4xl text-purple-600 mb-3"></i>
  <p class="font-semibold text-center">Our Products</p>
</a>

<a href="whatsnew.html" class="nav-card w-40 h-40 flex flex-col items-center justify-center">
  <i class="fa-solid fa-gift text-4xl text-pink-600 mb-3"></i>

</a>

<a href="#" class="nav-card w-40 h-40 flex flex-col items-center justify-center">

  <p class="font-semibold text-center">Contact Us</p>
</a>
    </div>
  </div>

  <script>
    // Confetti on load
    setTimeout(() => {
      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
      });
    }, 800);

    // Tailwind custom cards
    const style = document.createElement('style');
    style.innerHTML = `
      .nav-card {
 
  background: white;
  border-radius: 20px;
  padding: 1rem;
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
  transition: all 0.3s;


      }
      .nav-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
