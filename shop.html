<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Handcrafted Joy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .product-card { transition: all 0.3s; }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .cart-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Top Bar -->
  <nav class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-purple-700">Handcrafted Joy</a>
      <div class="flex items-center gap-8">
        <a href="shop.html" class="font-medium text-purple-600">Shop</a>
        <a href="#" class="hover:text-purple-600">Bookmarks</a>
        <a href="#" class="hover:text-purple-600">What's New</a>
        <a href="#" class="hover:text-purple-600">Contact</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-center mb-4">Our Collection</h1>
    <p class="text-center text-gray-600 mb-12">Hand-painted handkerchiefs, bookmarks & more</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="product-list">
      <!-- Products will load here -->
    </div>
  </div>

  <!-- Floating Cart (Always Visible) -->
  <div class="cart-float">
    <button onclick="toggleCart()" 
      class="bg-purple-600 text-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 hover:bg-purple-700">
      <i class="fa-solid fa-cart-shopping text-2xl"></i>
      <span class="font-semibold">Cart</span>
      <span id="cart-count-float" class="bg-white text-purple-600 text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full">0</span>
    </button>
  </div>

  <!-- Cart Sidebar -->
  <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 overflow-auto">
    <div class="p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Your Cart</h2>
        <button onclick="toggleCart()" class="text-3xl leading-none">×</button>
      </div>
      <div id="cart-items" class="space-y-6"></div>
      
      <div class="mt-10 border-t pt-6">
        <div class="flex justify-between text-xl font-semibold mb-6">
          <span>Total</span>
          <span id="cart-total">₹0</span>
        </div>
        <button onclick="checkout()" 
          class="w-full bg-purple-600 text-white py-5 rounded-2xl font-semibold text-lg hover:bg-purple-700">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script>
    // ================== PRODUCTS ==================
    const products = [
      {
        id: 1,
        name: "Hand Painted Yellow Floral Handkerchief",
        price: 149,
        image: "/attachments/image.png",           // Your uploaded image
        desc: "Beautiful yellow cotton handkerchief with blue floral pattern. Soft and vibrant."
      },
      {
        id: 2,
        name: "Fevicryl Acrylic Paint 500ml - White",
        price: 280,
        image: "https://via.placeholder.com/600x600?text=Fevicryl+White",
        desc: "High quality acrylic paint perfect for fabric painting."
      },
      {
        id: 3,
        name: "Set of 3 Handmade Bookmarks",
        price: 120,
        image: "https://via.placeholder.com/600x600?text=Bookmarks",
        desc: "Hand painted decorative bookmarks."
      }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="product-card bg-white rounded-3xl overflow-hidden shadow">
          <a href="product.html?id=${p.id}">
            <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover">
          </a>
          <div class="p-6">
            <h3 class="font-semibold text-lg">${p.name}</h3>
            <p class="text-purple-600 text-2xl font-bold mt-2">₹${p.price}</p>
            <button onclick="addToCart(${p.id}); event.stopImmediatePropagation()" 
              class="mt-6 w-full bg-purple-600 text-white py-3 rounded-2xl hover:bg-purple-700">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    // Cart Functions
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity += 1;
      else cart.push({...product, quantity: 1});

      updateCartCount();
      alert(`${product.name} added to cart!`);
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count-float').textContent = count;
    }

    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center py-12 text-gray-500">Your cart is empty</p>`;
        totalEl.textContent = '₹0';
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div class="flex gap-4">
          <img src="${item.image}" class="w-20 h-20 object-cover rounded-xl">
          <div class="flex-1">
            <p class="font-medium">${item.name}</p>
            <p class="text-purple-600">₹${item.price} × ${item.quantity}</p>
            <button onclick="removeFromCart(${index}); event.stopImmediatePropagation()" class="text-red-500 text-sm">Remove</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      totalEl.textContent = `₹${total}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
      updateCartCount();
    }

    function checkout() {
      alert("Thank you! This is a demo. We'll add Razorpay soon.");
      cart = [];
      toggleCart();
      updateCartCount();
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
