<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Srijanatmakta</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #f5f0ff, #e9dcff, #fdf6ff);
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div class="w-full min-h-screen flex flex-col items-center justify-center px-6 text-center">

    <!-- 🔙 Back Button -->
    <a href="index.html" class="text-purple-600 mb-6 inline-block">
      ← Back to Home
    </a>

    <!-- 🌙 Title -->
    <h1 class="text-3xl md:text-4xl font-bold text-purple-700 mb-6">
      3am thoughts 🌙
    </h1>

    <!-- 💭 Thoughts Slider -->
    <div class="relative w-full max-w-xl overflow-hidden bg-white rounded-2xl shadow-lg">

      <div id="thoughts" class="flex transition-transform duration-500">

        <div class="min-w-full p-8">
          <p class="text-lg italic text-purple-700">
            "what if small things are actually the most meaningful?"
          </p>
        </div>

        <div class="min-w-full p-8">
          <p class="text-lg italic text-purple-700">
            "handmade things feel like someone cared a little extra."
          </p>
        </div>

        <div class="min-w-full p-8">
          <p class="text-lg italic text-purple-700">
            "maybe creativity is just courage in disguise."
          </p>
        </div>

      </div>

      <!-- ⬅️➡️ Buttons -->
      <button onclick="prev()" class="absolute left-3 top-1/2 -translate-y-1/2 text-2xl text-purple-500">
        ←
      </button>

      <button onclick="next()" class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl text-purple-500">
        →
      </button>

    </div>

    <!-- 📩 Contact Info -->
    <div class="mt-10 text-purple-600 space-y-2">
      <p>Email: your@email.com</p>
      <p>Instagram: @yourhandle</p>
      <p>Phone: +91 XXXXX XXXXX</p>
    </div>

  </div>

  <script>
    let index = 0;

    function updateSlider() {
      const slider = document.getElementById('thoughts');
      slider.style.transform = `translateX(-${index * 100}%)`;
    }

    function next() {
      if (index < 2) {
        index++;
        updateSlider();
      }
    }

    function prev() {
      if (index > 0) {
        index--;
        updateSlider();
      }
    }
  </script>

</body>
</html>
